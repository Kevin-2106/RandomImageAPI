[app]
host = "0.0.0.0"
port = 9652
debug = false
base_url = "http://localhost:9652"

[images]
image_dir = "/path/to/images"
latest_dir = "/path/to/images/latest"
supported_extensions = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".bmp", ".tiff", ".avif"]
scan_on_startup = true

[database]
path = "data/imageapi.db"

[rate_limit]
enabled = true
requests_per_minute = 60

[security]
# 生产环境推荐设置 RANDOM_IMAGE_ADMIN_KEY，而不是在文件中保存密钥。
admin_api_key = "change-me"
